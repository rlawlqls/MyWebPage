{{- if .value -}}
  <a href="{{ .href }}" class="hero-social-link" aria-label="{{ .label }}" title="{{ .label }}"{{ if .external }} target="_blank" rel="noopener noreferrer"{{ end }}>
    {{- partial "social-icon.html" .icon -}}
  </a>
{{- else -}}
  <span class="hero-social-link is-placeholder" aria-label="{{ .label }} 링크 준비 중" aria-disabled="true" title="{{ .label }} 링크 준비 중">
    {{- partial "social-icon.html" .icon -}}
  </span>
{{- end -}}
