<section id="projects" class="section bg-background" style="border-bottom: 1px solid hsl(var(--border) / 0.4);">
  <div class="container" style="max-width: 72rem;">
    <div style="max-width: 48rem; margin-bottom: 3rem;">
      <h2 class="section-header mb-4">
        <span class="section-bar"></span>
        프로젝트와 경험
      </h2>
      <p class="text-muted" style="line-height: 1.8;">카드를 선택하면 문제와 목표, 제가 맡은 역할, 구현 과정과 결과를 자세히 볼 수 있습니다.</p>
    </div>

    <div class="project-card-grid">
      {{- range .Site.Data.projects }}
        <a href="{{ .slug | relURL }}" class="project-card card" aria-label="{{ .title }} 세부 페이지 보기">
          <div class="project-card-content">
            <div class="project-card-header">
              <p class="project-card-program">{{ .program }}</p>
              <time class="project-card-period">{{ .period }}</time>
            </div>
            <h3 class="project-card-title">{{ .title }}</h3>
            <p class="project-card-subtitle">{{ .subtitle }}</p>
            <p class="project-card-description text-muted">{{ .description }}</p>
            {{- with .tags }}
              <div class="project-card-tags">
                {{- range . }}<span class="badge">{{ . }}</span>{{- end }}
              </div>
            {{- end }}
            <div class="project-card-footer">
              <span>프로젝트 보기</span>
              <span class="project-card-arrow" aria-hidden="true">&rarr;</span>
            </div>
          </div>
        </a>
      {{- end }}
    </div>
  </div>
</section>
