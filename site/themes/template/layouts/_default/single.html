{{ define "main" }}
  <article id="top" class="detail-page">
    <header class="detail-hero section bg-muted-30" style="padding-top: 9rem; padding-bottom: 4rem; border-bottom: 1px solid hsl(var(--border) / 0.4);">
      <div class="container" style="max-width: 64rem; text-align: center;">
        <p class="text-primary font-bold mb-4" style="letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.75rem;">
          포트폴리오
        </p>
        <h1 class="font-display font-bold" style="font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1.1; margin-bottom: 1.25rem;">
          {{ .Title }}
        </h1>
        {{ with .Description }}
          <p class="text-muted" style="max-width: 42rem; margin: 0 auto; font-size: clamp(1rem, 2vw, 1.25rem); line-height: 1.7;">
            {{ . }}
          </p>
        {{ end }}
      </div>
    </header>

    {{- with .Params.content_partial }}
      {{- partial (printf "%s.html" .) $ -}}
    {{- else }}
      <section class="section" style="padding-top: 4rem; padding-bottom: 4rem;">
        <div class="detail-content container" style="max-width: 52rem; font-size: 1.0625rem; line-height: 1.8;">
          {{ $.Content }}
        </div>
      </section>
    {{- end }}

    <section class="page-navigation" aria-label="Page navigation" style="padding: 2rem 0 4rem; background-color: hsl(var(--background));">
      <div class="container" style="max-width: 52rem; padding-top: 2rem; border-top: 1px solid hsl(var(--border) / 0.6);">
        <a href="{{ .Site.Home.RelPermalink }}" class="btn btn-outline">
          <span aria-hidden="true">&larr;</span>
          홈으로 돌아가기
        </a>
      </div>
    </section>
  </article>
{{ end }}
