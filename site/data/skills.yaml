- category: "개발"
  items:
    - name: "HTML · CSS · JavaScript"
      explanation: "스마트 모빌리티 전문가 양성과정에서 웹 기초를 익히고 제주도 기반 내비게이션을 만들었습니다."
    - name: "Unity · C#"
      explanation: "Dear Grandma 요리 게임의 메뉴, 장면 연결, 스토리 장면과 요리 단계 기능을 구현했습니다."
    - name: "C"
      explanation: "ALPS 동아리에서 C언어 멘토로 활동하며 기초 문법과 문제 해결 과정을 설명했습니다."
    - name: "Git · GitHub"
      explanation: "팀 프로젝트의 버전 관리와 기능 통합, 개인 프로젝트의 개발 기록에 사용합니다."

- category: "AI · Physical Computing"
  items:
    - name: "Machine Learning"
      explanation: "음성 데이터를 직접 수집하고 라벨링과 window 크기를 조정하며 여러 모델의 인식 결과를 비교했습니다."
    - name: "Arduino"
      explanation: "머신러닝 모델과 Arduino, 웹 인터페이스를 연동한 Physical AI 서비스를 구현했습니다."
    - name: "Google Cloud Vision API"
      explanation: "Market Mate AI에서 시장 메뉴판 이미지를 인식하는 기능을 웹 서비스와 연결했습니다."
    - name: "Gemini API"
      explanation: "Market Mate AI에서 인식된 메뉴에 대한 설명과 주문 표현을 제공하기 위해 활용했습니다."

- category: "협업 · 리더십"
  items:
    - name: "프로젝트 기획"
      explanation: "문제 상황을 정의하고 아이디어를 MVP로 구체화하는 팀 프로젝트를 반복했습니다."
    - name: "멘토링"
      explanation: "ALPS C언어 멘토와 SW 교육봉사단 활동을 통해 배운 내용을 다른 사람의 눈높이에 맞게 전달했습니다."
    - name: "팀 운영"
      explanation: "2026년 ALPS 부회장으로 활동하며 JBNUPC 경진대회 운영에 참여했습니다."
    - name: "영어 발표"
      explanation: "UNLV 교육연수에서 Physical AI 프로젝트의 문제, 방법, 결과를 영어로 발표했습니다."
